<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickAI - AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>🤖 QuickAI</h1>
            <p>Your fast AI assistant</p>
        </header>

        <main id="chat">
            <div class="message ai">
                Hello! I'm QuickAI. How can I help you?
            </div>
        </main>

        <div class="input-area">

            <input
                id="message"
                type="What is JavaScript"
                placeholder="Ask QuickAI anything..."
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
